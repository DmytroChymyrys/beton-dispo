<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="presentation">
  <title>Concrete boom pump reaching over a construction site</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f7" />
      <stop offset="1" stop-color="#ebe8e3" />
    </linearGradient>
    <pattern id="aggregate" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.2" fill="#1b1e24" opacity=".05" />
      <circle cx="21" cy="17" r=".9" fill="#1b1e24" opacity=".04" />
      <circle cx="12" cy="24" r="1.4" fill="#1b1e24" opacity=".045" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)" />
  <rect y="640" width="1200" height="160" fill="#e3dfd8" />
  <rect width="1200" height="800" fill="url(#aggregate)" />
  <path d="M0 640h1200" stroke="#1b1e24" stroke-opacity=".16" stroke-width="3" />
  <!-- Faint background site, for depth. Deliberately unbranded. -->
  <g fill="#1b1e24" opacity=".07">
    <rect x="70" y="430" width="160" height="210" />
    <rect x="252" y="360" width="120" height="280" />
    <rect x="960" y="400" width="190" height="240" />
  </g>

  <ellipse cx="480" cy="644" rx="420" ry="14" fill="#1b1e24" opacity=".1" />

  <!-- Articulated boom, folded out over the site -->
  <g stroke="#22252b" fill="none" stroke-linecap="round">
    <path d="M430 470 300 210" stroke-width="30" />
    <path d="M300 210 760 130" stroke-width="26" />
    <path d="M760 130 1010 300" stroke-width="22" />
  </g>
  <g fill="#2f333b">
    <circle cx="300" cy="210" r="24" />
    <circle cx="760" cy="130" r="21" />
  </g>

  <!-- Delivery hose and the concrete leaving it -->
  <path d="M1010 300q40 90 -10 170" stroke="#c2410c" stroke-width="24" stroke-linecap="round" fill="none" />
  <path d="M986 486h34l22 74h-78z" fill="#dcd7cf" />
  <ellipse cx="1004" cy="576" rx="76" ry="22" fill="#dcd7cf" />

  <!-- Truck body, hopper and outriggers -->
  <rect x="150" y="470" width="600" height="70" rx="10" fill="#22252b" />
  <path d="M600 400h150v70H600z" fill="#2f333b" />
  <path d="M154 470V352a14 14 0 0 1 9-13l84-31h94a14 14 0 0 1 14 14v148z" fill="#22252b" />
  <path d="M174 368l72-26h48v60h-120z" fill="#dfe3e8" />
  <g stroke="#2f333b" stroke-width="16" stroke-linecap="round">
    <path d="M210 542 150 616" />
    <path d="M700 542 762 616" />
  </g>
  <g fill="#2f333b">
    <rect x="118" y="606" width="76" height="20" rx="8" />
    <rect x="722" y="606" width="76" height="20" rx="8" />
  </g>

  <g fill="#1b1e24">
    <circle cx="300" cy="590" r="54" />
    <circle cx="520" cy="590" r="54" />
    <circle cx="630" cy="590" r="54" />
  </g>
  <g fill="#b9b4ac">
    <circle cx="300" cy="590" r="22" />
    <circle cx="520" cy="590" r="22" />
    <circle cx="630" cy="590" r="22" />
  </g>
</svg>
