<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="presentation">
  <title>Ready-mix concrete truck discharging on site</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f7" />
      <stop offset="1" stop-color="#ebe8e3" />
    </linearGradient>
    <pattern id="aggregate" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="1.2" fill="#1b1e24" opacity=".05" />
      <circle cx="21" cy="17" r=".9" fill="#1b1e24" opacity=".04" />
      <circle cx="12" cy="24" r="1.4" fill="#1b1e24" opacity=".045" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)" />
  <rect y="640" width="1200" height="160" fill="#e3dfd8" />
  <rect width="1200" height="800" fill="url(#aggregate)" />
  <path d="M0 640h1200" stroke="#1b1e24" stroke-opacity=".16" stroke-width="3" />
  <!-- Faint background site, for depth. Deliberately unbranded. -->
  <g fill="#1b1e24" opacity=".07">
    <rect x="60" y="470" width="150" height="170" />
    <rect x="232" y="410" width="112" height="230" />
    <rect x="980" y="440" width="170" height="200" />
  </g>
  <g stroke="#1b1e24" stroke-opacity=".09" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M912 640V150h250" />
    <path d="M1162 150v70" />
    <path d="M912 214l113-64" />
  </g>

  <ellipse cx="600" cy="644" rx="520" ry="14" fill="#1b1e24" opacity=".1" />

  <!-- Mixing drum: a truncated cone tapering toward the discharge end -->
  <g transform="rotate(-8 665 400)">
    <path d="M486 288q-30 112 0 224l376-30q26 -94 0-188z" fill="#22252b" />
    <ellipse cx="486" cy="400" rx="26" ry="112" fill="#2f333b" />
    <ellipse cx="862" cy="400" rx="20" ry="94" fill="#2f333b" />
    <g stroke="#f1efec" stroke-width="10" fill="none" stroke-linecap="round" opacity=".45">
      <path d="M568 300q-30 100 0 200" />
      <path d="M680 296q-28 98 0 196" />
      <path d="M786 300q-26 92 0 184" />
    </g>
  </g>

  <!-- Frame struts carrying the drum -->
  <g stroke="#22252b" stroke-width="18" stroke-linecap="round">
    <path d="M468 512 500 372" />
    <path d="M892 512 866 380" />
  </g>

  <rect x="118" y="506" width="946" height="38" rx="8" fill="#22252b" />

  <!-- Cab, facing left -->
  <path d="M122 508V352a14 14 0 0 1 9-13l86-32h96a14 14 0 0 1 14 14v187z" fill="#22252b" />
  <path d="M142 368l74-27h50v62H142z" fill="#dfe3e8" />
  <rect x="112" y="470" width="26" height="40" rx="6" fill="#2f333b" />

  <!-- Discharge hopper and chute -->
  <path d="M896 320h116l-30 74h-56z" fill="#22252b" />
  <path d="M962 402l148 140" stroke="#c2410c" stroke-width="34" stroke-linecap="round" />
  <path d="M948 384l34 38" stroke="#22252b" stroke-width="16" stroke-linecap="round" />

  <!-- Formwork and the concrete leaving the chute -->
  <g stroke="#8d867c" stroke-width="9" stroke-linecap="round">
    <path d="M1054 594v48" />
    <path d="M1166 594v48" />
  </g>
  <path d="M1090 546h42l38 96h-118z" fill="#cfcac2" />

  <g fill="#1b1e24">
    <circle cx="248" cy="596" r="62" />
    <circle cx="808" cy="596" r="62" />
    <circle cx="936" cy="596" r="62" />
  </g>
  <g fill="#b9b4ac">
    <circle cx="248" cy="596" r="25" />
    <circle cx="808" cy="596" r="25" />
    <circle cx="936" cy="596" r="25" />
  </g>
</svg>
